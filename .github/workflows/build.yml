name: Build Lavalink with YouTube Source

on:
  workflow_dispatch:  # Bu sayede "Run workflow" butonu çıkacak
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Build youtube-source plugin
        run: |
          git clone https://github.com/lavalink-devs/youtube-source.git /tmp/youtube-source
          cd /tmp/youtube-source
          ./gradlew shadowJar --no-daemon
          mkdir -p ./plugins
          cp /tmp/youtube-source/build/libs/youtube-source-plugin-*.jar ./plugins/youtube-source-plugin.jar
      
      - name: Build Lavalink
        run: ./gradlew shadowJar --no-daemon
      
      - name: Upload Lavalink JAR
        uses: actions/upload-artifact@v4
        with:
          name: Lavalink-JAR
          path: build/libs/Lavalink-*.jar
      
      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Plugin
          path: plugins/youtube-source-plugin.jar
